<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Camadas de vidro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bbb}a:hover{color:#fff}
</style>
</helmet>
<div style="width: 520px; height: 520px; background: #161618; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; color: #e8e8ea">
<div style="width: 482px; height: 482px; border-radius: 50%; padding: 16px; box-sizing: border-box; background: linear-gradient(145deg, #4a4b50 0%, #1b1b1e 45%, #0a0a0b 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.18)">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 35%, #141416 0%, #040405 70%)">

<div style="position: absolute; left: 105px; top: -18px; width: 240px; height: 170px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.9))">
<span style="font-size: 190px; line-height: 1; background: linear-gradient(180deg, #f2f2f4 0%, #9a9aa0 50%, #3a3a3f 100%); -webkit-background-clip: text; background-clip: text; color: transparent">12</span>
</div>
<div style="position: absolute; left: 300px; top: 140px; width: 150px; height: 170px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.9))">
<span style="font-size: 190px; line-height: 1; background: linear-gradient(180deg, #f2f2f4 0%, #9a9aa0 50%, #3a3a3f 100%); -webkit-background-clip: text; background-clip: text; color: transparent">3</span>
</div>
<div style="position: absolute; left: 150px; top: 300px; width: 150px; height: 170px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.9))">
<span style="font-size: 190px; line-height: 1; background: linear-gradient(180deg, #f2f2f4 0%, #9a9aa0 50%, #3a3a3f 100%); -webkit-background-clip: text; background-clip: text; color: transparent">6</span>
</div>
<div style="position: absolute; left: 0px; top: 140px; width: 150px; height: 170px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.9))">
<span style="font-size: 190px; line-height: 1; background: linear-gradient(180deg, #f2f2f4 0%, #9a9aa0 50%, #3a3a3f 100%); -webkit-background-clip: text; background-clip: text; color: transparent">9</span>
</div>

<div style="position: absolute; left: 92px; top: 92px; width: 266px; height: 266px; box-sizing: border-box; border-radius: 50%; background: rgba(12,12,14,0.58); backdrop-filter: blur(9px) saturate(115%); -webkit-backdrop-filter: blur(9px) saturate(115%); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 34px 60px rgba(0,0,0,0.9), 0 0 0 6px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -10px 30px rgba(0,0,0,0.6)"></div>

<sc-for list="{{marks}}" as="t" hint-placeholder-count="12">
<div style="{{t.outer}}"><div style="{{t.inner}}"></div></div>
</sc-for>

<div style="position: absolute; left: 175px; top: 140px; width: 100px; display: flex; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; letter-spacing: 3px; color: #a0a0a6">{{dateLabel}}</div>
<div style="position: absolute; left: 175px; top: 286px; width: 100px; display: flex; justify-content: center; align-items: baseline; gap: 5px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600">
<span style="font-size: 20px; color: {{accent}}">♥ 72</span>
<span style="font-size: 12px; letter-spacing: 2px; color: #8a8a90">BPM</span>
</div>

<div style="position: absolute; inset: 0; filter: drop-shadow(2px 7px 4px rgba(0,0,0,0.85))">
<div style="position: absolute; left: 218px; top: 145px; width: 14px; height: 80px; transform-origin: 50% 100%; transform: rotate({{hourDeg}}deg)">
<div style="width: 100%; height: 100%; background: linear-gradient(90deg, #ffffff 0%, #ffffff 50%, #9d9da3 50%, #9d9da3 100%); clip-path: polygon(50% 0, 100% 16%, 100% 100%, 0 100%, 0 16%)"></div>
</div>
</div>
<div style="position: absolute; inset: 0; filter: drop-shadow(3px 11px 5px rgba(0,0,0,0.8))">
<div style="position: absolute; left: 220px; top: 105px; width: 10px; height: 120px; transform-origin: 50% 100%; transform: rotate({{minuteDeg}}deg)">
<div style="width: 100%; height: 100%; background: linear-gradient(90deg, #f4f4f6 0%, #f4f4f6 50%, #8c8c92 50%, #8c8c92 100%); clip-path: polygon(50% 0, 100% 10%, 100% 100%, 0 100%, 0 10%)"></div>
</div>
</div>
<sc-if value="{{showSeconds}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; filter: drop-shadow(5px 16px 6px rgba(0,0,0,0.75))">
<div style="position: absolute; left: 223.5px; top: 95px; width: 3px; height: 160px; transform-origin: 50% 130px; transform: rotate({{secondDeg}}deg); background: {{accent}}; border-radius: 2px"></div>
</div>
</sc-if>
<div style="position: absolute; left: 214px; top: 214px; width: 22px; height: 22px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff 0%, #8d8d92 45%, #26262a 100%); box-shadow: 0 5px 10px rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center">
<div style="width: 7px; height: 7px; border-radius: 50%; background: {{accent}}"></div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#3ea6ff","#c6ff3d","#e8e8ea"]},"showSeconds":{"editor":"boolean","default":true},"liveTime":{"editor":"boolean","default":true},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const live = this.props.liveTime ?? true;
const d = live ? new Date() : new Date(2026, 9, 4, 10, 9, 30);
const h = d.getHours() % 12, m = d.getMinutes(), s = d.getSeconds();
const days = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
const marks = [];
for (let i = 0; i < 12; i++) {
const major = i % 3 === 0;
const w = major ? 4 : 2;
marks.push({
outer: 'position:absolute;left:' + (225 - w / 2) + 'px;top:100px;width:' + w + 'px;height:250px;transform:rotate(' + (i * 30) + 'deg)',
inner: 'margin-top:6px;width:100%;height:' + (major ? 14 : 8) + 'px;border-radius:1px;background:' + (major ? '#e4e4e8' : '#6a6a70')
});
}
return {
accent: this.props.accent ?? '#ff5a1f',
showSeconds: this.props.showSeconds ?? true,
marks,
hourDeg: h * 30 + m * 0.5,
minuteDeg: m * 6 + s * 0.1,
secondDeg: s * 6,
dateLabel: days[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0')
};
}
}
</script>
</body>
</html>
