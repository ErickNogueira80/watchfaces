<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Esqueleto infinito digital</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bbb}a:hover{color:#fff}
@keyframes wfspin{to{transform:rotate(360deg)}}
@keyframes wfspinr{to{transform:rotate(-360deg)}}
@keyframes wfbal{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(150deg)}}
.wf path{fill:url(#wfSteel);stroke:rgba(255,255,255,0.16);stroke-width:0.6;fill-rule:evenodd}
.wf.dark path{fill:url(#wfDark);stroke:rgba(255,255,255,0.08)}
.wf.acc path{fill:url(#wfAcc);stroke:rgba(255,255,255,0.3)}
.wf path.hair{fill:none;stroke:#8a8a90;stroke-width:0.7}
.wf.dark path.hair{fill:none;stroke:#55555a}
.frame{fill:url(#wfFrame);stroke:rgba(0,0,0,0.7);stroke-width:0.8;fill-rule:nonzero}
@media (prefers-reduced-motion: reduce){.wf-anim{animation:none !important}}
</style>
</helmet>
<div style="width: 520px; height: 520px; background: #161618; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif">
<div style="width: 482px; height: 482px; border-radius: 50%; padding: 16px; box-sizing: border-box; background: linear-gradient(145deg, #4a4b50 0%, #1b1b1e 45%, #0a0a0b 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.18)">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; overflow: hidden; background: #000000">

<svg width="0" height="0" style="position: absolute">
<defs>
<radialGradient id="wfSteel"><stop offset="0" style="stop-color: #8e8e94"></stop><stop offset="0.55" style="stop-color: #48484e"></stop><stop offset="1" style="stop-color: #1c1c20"></stop></radialGradient>
<radialGradient id="wfDark"><stop offset="0" style="stop-color: #36363c"></stop><stop offset="0.6" style="stop-color: #18181b"></stop><stop offset="1" style="stop-color: #0a0a0b"></stop></radialGradient>
<radialGradient id="wfAcc"><stop offset="0" style="stop-color: #ffe2cf"></stop><stop offset="0.5" style="stop-color: {{accent}}"></stop><stop offset="1" style="stop-color: #3a1204"></stop></radialGradient>
<linearGradient id="wfFrame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: #3a3a40"></stop><stop offset="0.28" style="stop-color: #121214"></stop><stop offset="0.5" style="stop-color: #46464c"></stop><stop offset="0.72" style="stop-color: #0e0e10"></stop><stop offset="1" style="stop-color: #2e2e33"></stop></linearGradient>
</defs>
</svg>

<div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, #0c0c0e 0%, #030304 70%)"></div>

<div style="position: absolute; inset: 0; filter: brightness(0.42) blur(2px)">
<sc-for list="{{far}}" as="g" hint-placeholder-count="48">
<div style="{{g.outer}}"><div class="wf-anim" style="{{g.anim}}"><div style="{{g.phase}}"><svg class="{{g.cls}}" viewBox="{{g.vb}}" width="100%" height="100%"><path d="{{g.d}}"></path></svg></div></div></div>
</sc-for>
</div>
<div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.35) 80%)"></div>

<div style="position: absolute; inset: 0; filter: brightness(0.58) blur(1.2px)">
<sc-for list="{{back}}" as="g" hint-placeholder-count="32">
<div style="{{g.outer}}"><div class="wf-anim" style="{{g.anim}}"><div style="{{g.phase}}"><svg class="{{g.cls}}" viewBox="{{g.vb}}" width="100%" height="100%"><path d="{{g.d}}"></path></svg></div></div></div>
</sc-for>
</div>
<div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.3) 80%)"></div>

<div style="position: absolute; inset: 0; filter: brightness(0.75) blur(0.6px)">
<sc-for list="{{deep}}" as="g" hint-placeholder-count="28">
<div style="{{g.outer}}"><div class="wf-anim" style="{{g.anim}}"><div style="{{g.phase}}"><svg class="{{g.cls}}" viewBox="{{g.vb}}" width="100%" height="100%"><path d="{{g.d}}"></path><path class="hair" d="{{g.d2}}"></path></svg></div></div></div>
</sc-for>
</div>
<div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 80%)"></div>

<sc-for list="{{wheels}}" as="g" hint-placeholder-count="8">
<div style="{{g.outer}}"><div class="wf-anim" style="{{g.anim}}"><div style="{{g.phase}}"><svg class="{{g.cls}}" viewBox="{{g.vb}}" width="100%" height="100%"><path d="{{g.d}}"></path><path class="hair" d="{{g.d2}}"></path></svg></div></div></div>
</sc-for>

<svg viewBox="0 0 450 450" width="450" height="450" style="position: absolute; left: 0; top: 0; filter: drop-shadow(0 -1px 0 rgba(255,255,255,0.28)) drop-shadow(0 1px 0 rgba(0,0,0,0.9)) drop-shadow(0 12px 10px rgba(0,0,0,0.9))"><path class="frame" d="{{framePath}}"></path></svg>
<svg viewBox="0 0 450 450" width="450" height="450" style="position: absolute; left: 0; top: 0; filter: drop-shadow(0 -1px 0 rgba(255,255,255,0.4)) drop-shadow(0 16px 12px rgba(0,0,0,0.9))"><path class="frame" d="{{tbPath}}"></path></svg>

<sc-for list="{{screws}}" as="sc" hint-placeholder-count="10">
<div style="{{sc.style}}"></div>
</sc-for>
<sc-for list="{{jewels}}" as="j" hint-placeholder-count="5">
<div style="{{j.style}}"></div>
</sc-for>

<div style="position: absolute; inset: 0; filter: drop-shadow(0 0 2px rgba(0,0,0,1)) drop-shadow(0 4px 3px rgba(0,0,0,1)) drop-shadow(0 14px 12px rgba(0,0,0,0.95))">
<div style="position: absolute; inset: 0">
<div style="position: absolute; left: 22px; top: 185px; width: 170px; height: 80px; display: flex; align-items: baseline; justify-content: center; gap: 4px; color: #e6e6ea">
<span style="font-size: 72px; line-height: 1; letter-spacing: 1px">{{hh}}</span>
<span style="font-size: 72px; line-height: 1; color: {{accent}}">:</span>
<span style="font-size: 72px; line-height: 1; letter-spacing: 1px">{{mm}}</span>
</div>
<div style="position: absolute; left: 22px; top: 262px; width: 170px; text-align: center; font-size: 22px; letter-spacing: 4px; color: #a8a8ae">{{ss}}</div>
</div>
</div>

<div style="position: absolute; inset: 0; filter: drop-shadow(0 0 1px rgba(0,0,0,0.9)) drop-shadow(3px 12px 7px rgba(0,0,0,0.9))">
<div style="position: absolute; left: 219px; top: 143px; width: 12px; height: 97px; border-radius: 3px; transform-origin: 50% 82px; transform: rotate({{hourDeg}}deg); background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.3) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2) 100%), {{accent}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35)"></div>
</div>
<div style="position: absolute; inset: 0; filter: drop-shadow(0 0 1px rgba(0,0,0,0.9)) drop-shadow(4px 15px 8px rgba(0,0,0,0.88))">
<div style="position: absolute; left: 220px; top: 60px; width: 10px; height: 182px; border-radius: 3px; transform-origin: 50% 165px; transform: rotate({{minuteDeg}}deg); background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.3) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2) 100%), {{accent}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.35)"></div>
</div>
<div style="position: absolute; inset: 0; filter: drop-shadow(0 0 0.8px rgba(255,255,255,0.45)) drop-shadow(5px 18px 7px rgba(0,0,0,0.85))">
<div style="position: absolute; left: 223.75px; top: 40px; width: 2.5px; height: 220px; border-radius: 2px; transform-origin: 50% 185px; transform: rotate({{secondDeg}}deg); background: #0a0a0b"></div>
</div>
<div style="position: absolute; left: 213px; top: 213px; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2a2a2e 0%, #050506 70%); border: 2px solid #4a4a50; box-shadow: 0 5px 10px rgba(0,0,0,0.9)"></div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#e0218a","#d4af37","#3ea6ff"]},"animate":{"editor":"boolean","default":true},"liveTime":{"editor":"boolean","default":true},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const accent = this.props.accent ?? '#ff5a1f';
const animate = this.props.animate ?? true;
const live = this.props.liveTime ?? true;
const d = live ? new Date() : new Date(2026, 9, 4, 10, 9, 30);
const h = d.getHours() % 12, m = d.getMinutes(), s = d.getSeconds();

const TAU = Math.PI * 2;
const pt = (a, r) => (r * Math.sin(a)).toFixed(2) + ' ' + (-r * Math.cos(a)).toFixed(2);
const circ = (r) => 'M' + pt(0, r) + ' A' + r + ' ' + r + ' 0 1 1 ' + pt(Math.PI, r) + ' A' + r + ' ' + r + ' 0 1 1 ' + pt(0, r) + ' Z ';
const windows = (rim, hub, spokes, sw) => {
let out = '';
const sa = TAU / spokes;
for (let k = 0; k < spokes; k++) {
const a0 = k * sa, a1 = a0 + sa;
const o0 = a0 + sw / 2 / rim, o1 = a1 - sw / 2 / rim, i0 = a0 + sw / 2 / hub, i1 = a1 - sw / 2 / hub;
const bo = o1 - o0 > Math.PI ? 1 : 0, bi = i1 - i0 > Math.PI ? 1 : 0;
out += 'M' + pt(o0, rim) + ' A' + rim.toFixed(2) + ' ' + rim.toFixed(2) + ' 0 ' + bo + ' 1 ' + pt(o1, rim) + ' L' + pt(i1, hub) + ' A' + hub.toFixed(2) + ' ' + hub.toFixed(2) + ' 0 ' + bi + ' 0 ' + pt(i0, hub) + ' Z ';
}
return out;
};
const gearD = (n, mod, spokes) => {
const rp = n * mod / 2, ro = rp + mod, rr = rp - 1.25 * mod, st = TAU / n;
let p = '';
for (let i = 0; i < n; i++) {
const a = i * st;
p += (i ? 'L' : 'M') + pt(a, rr) + ' L' + pt(a + 0.14 * st, ro) + ' L' + pt(a + 0.36 * st, ro) + ' L' + pt(a + 0.5 * st, rr) + ' ';
}
p += 'Z ';
const rim = rr - Math.max(3, mod * 1.4), hub = Math.max(5, rp * 0.24);
if (spokes && rim - hub > 6) p += windows(rim, hub, spokes, Math.max(2.5, rp * 0.1));
return { d: p + circ(Math.max(1.5, mod * 0.7)), ro };
};
const wheelD = (R, rimW, spokes) => ({ d: circ(R) + windows(R - rimW, Math.max(4, R * 0.14), spokes, Math.max(2.5, R * 0.08)) + circ(1.6), ro: R });
const spiral = (r0, r1, turns) => {
let p = '';
const steps = turns * 36;
for (let i = 0; i <= steps; i++) {
const t = i / steps;
p += (i ? 'L' : 'M') + pt(t * turns * TAU, r0 + (r1 - r0) * t) + ' ';
}
return p;
};
const paused = animate ? '' : ';animation-play-state:paused';
const spin = (n, dir, base) => 'animation:' + (dir > 0 ? 'wfspin' : 'wfspinr') + ' ' + (base * n / 48).toFixed(2) + 's linear infinite' + paused;
const swing = (sec) => 'animation:wfbal ' + sec + 's ease-in-out infinite' + paused;
const item = (x, y, shape, cls, anim, phase, shadow, d2) => {
const sz = Math.ceil(shape.ro * 2 + 2), hf = sz / 2;
return {
d: shape.d, d2: d2 || '', cls: 'wf ' + cls,
vb: (-hf) + ' ' + (-hf) + ' ' + sz + ' ' + sz,
outer: 'position:absolute;left:' + (x - hf).toFixed(1) + 'px;top:' + (y - hf).toFixed(1) + 'px;width:' + sz + 'px;height:' + sz + 'px;filter:' + shadow,
anim: 'width:100%;height:100%;' + anim,
phase: 'width:100%;height:100%;transform:rotate(' + phase.toFixed(2) + 'deg)'
};
};
const mesh = (g, n2, mod, ang) => {
const dist = (g.n + n2) * mod / 2, phi = ang * Math.PI / 180;
const s1 = 360 / g.n, s2 = 360 / n2;
const f = ((((ang - g.phase - 0.25 * s1) % s1) + s1) % s1) / s1;
return { x: g.x + dist * Math.sin(phi), y: g.y - dist * Math.cos(phi), n: n2, phase: ang + 180 - 0.75 * s2 + f * s2 };
};

// Camadas de fundo geradas: quanto mais longe, menores e mais lentas
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const field = (count, mod, nMin, nMax, rMax, base, offset, cls) => {
const out = [];
for (let i = 0; i < count; i++) {
const r = rMax * Math.sqrt((i + 0.5) / count), a = (i * 137.508 + offset) * Math.PI / 180;
const x = 225 + r * Math.sin(a) + (rnd() - 0.5) * 14, y = 225 - r * Math.cos(a) + (rnd() - 0.5) * 14;
const n = nMin + Math.floor(rnd() * (nMax - nMin));
out.push(item(x, y, gearD(n, mod, 3 + Math.floor(rnd() * 4)), cls, spin(n, rnd() > 0.5 ? 1 : -1, base), rnd() * 360, 'none'));
}
return out;
};
const far = field(48, 1.3, 16, 46, 220, 140, 11, 'dark');
const back = field(32, 1.8, 16, 50, 210, 100, 61, '');

// Armação em X (C5), tamanho cheio (sem anel de números)
const C = 225, K = 1;
const P = (deg, r) => ({ x: C + r * K * Math.sin(deg * Math.PI / 180), y: C - r * K * Math.cos(deg * Math.PI / 180), deg });
const S = (x, y) => ({ x: C + (x - C) * K, y: C + (y - C) * K });
const f2 = (v) => v.toFixed(2);
const poly = (pts) => {
let a = 0;
for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p[0] * q[1] - q[0] * p[1]; }
if (a < 0) pts.reverse();
return 'M' + pts.map((p) => f2(p[0]) + ' ' + f2(p[1])).join(' L') + ' Z ';
};
const ringAt = (x, y, r, cw) => 'M' + f2(x) + ' ' + f2(y - r) + ' A' + r + ' ' + r + ' 0 1 ' + (cw ? 1 : 0) + ' ' + f2(x) + ' ' + f2(y + r) + ' A' + r + ' ' + r + ' 0 1 ' + (cw ? 1 : 0) + ' ' + f2(x) + ' ' + f2(y - r) + ' Z ';
const beam = (a, b, w) => {
const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy), nx = -dy / L * w / 2, ny = dx / L * w / 2;
return poly([[a.x + nx, a.y + ny], [b.x + nx, b.y + ny], [b.x - nx, b.y - ny], [a.x - nx, a.y - ny]]) + ringAt(a.x, a.y, w / 2, 1) + ringAt(b.x, b.y, w / 2, 1);
};
const band = (r1, r2, a0, a1) => {
const big = a1 - a0 > 180 ? 1 : 0, o0 = P(a0, r2 / K), o1 = P(a1, r2 / K), i1 = P(a1, r1 / K), i0 = P(a0, r1 / K);
return 'M' + f2(o0.x) + ' ' + f2(o0.y) + ' A' + r2 + ' ' + r2 + ' 0 ' + big + ' 1 ' + f2(o1.x) + ' ' + f2(o1.y) + ' L' + f2(i1.x) + ' ' + f2(i1.y) + ' A' + r1 + ' ' + r1 + ' 0 ' + big + ' 0 ' + f2(i0.x) + ' ' + f2(i0.y) + ' Z ' + ringAt(o0.x / 2 + i0.x / 2, o0.y / 2 + i0.y / 2, (r2 - r1) / 2, 1) + ringAt(o1.x / 2 + i1.x / 2, o1.y / 2 + i1.y / 2, (r2 - r1) / 2, 1);
};
let framePath = ringAt(C, C, 224, 1) + ringAt(C, C, 208, 0) + ringAt(C, C, 33, 1) + ringAt(C, C, 24, 0);
framePath += band(85, 95, -135, 135);
[45, 135, 225, 315].forEach((a) => { framePath += beam(P(a, 40), P(a, 202), 14); });
[90, 270].forEach((a) => { framePath += beam(P(a, 40), P(a, 202), 11); });
framePath += beam(P(0, 40), P(0, 110), 11);
[45, 315, 90, 270].forEach((a) => { framePath += ringAt(P(a, 110).x, P(a, 110).y, 10, 1); });
const T = S(225, 340);
const tbPath = beam(P(140, 150), T, 12) + beam(T, P(220, 150), 12) + ringAt(T.x, T.y, 13, 1);

// Mecanismo principal
const MID = 'drop-shadow(0 8px 6px rgba(0,0,0,0.9))';
const HIGH = 'drop-shadow(0 12px 8px rgba(0,0,0,0.85))';
const mo = 2.4 * K;
const center = { x: 225, y: 225, n: 40, phase: 0 };
const g3 = mesh(center, 24, mo, 60);
const g4 = mesh(center, 28, mo, 300);
const right = P(90, 154), left = P(270, 154), top = S(225, 70), esc = P(150, 160);
const deep = [
item(S(150, 150).x, S(150, 150).y, gearD(50, 2.6 * K, 5), 'dark', spin(50, 1, 70), 0, 'none'),
item(S(300, 150).x, S(300, 150).y, gearD(44, 2.6 * K, 5), 'dark', spin(44, -1, 70), 0, 'none'),
item(T.x, T.y, gearD(54, 2.6 * K, 6), 'dark', spin(54, -1, 80), 0, 'none'),
item(center.x, center.y, gearD(40, mo, 5), 'dark', spin(40, 1, 60), 0, 'none')
].concat(field(16, 2.3, 18, 46, 170, 80, 33, ''), [22, 68, 112, 248, 292, 338].map((a, i) => { const p = P(a, 128 / K), n = 22 + (i * 5) % 10; return item(p.x, p.y, gearD(n, 1.9, 4), '', spin(n, i % 2 ? 1 : -1, 60), i * 23, 'drop-shadow(0 6px 5px rgba(0,0,0,0.9))'); }), [112, 248].map((a, i) => { const p = P(a, 58 / K); return item(p.x, p.y, gearD(16, 1.9, 3), '', spin(16, i ? -1 : 1, 60), 0, 'drop-shadow(0 6px 5px rgba(0,0,0,0.9))'); }));
const wheels = [
item(top.x, top.y, gearD(44, 2.2 * K, 6), '', spin(88, -1, 60), 0, MID, spiral(7, 30, 8)),
item(g3.x, g3.y, gearD(24, mo, 4), '', spin(24, -1, 60), g3.phase, MID),
item(g4.x, g4.y, gearD(28, mo, 4), '', spin(28, -1, 60), g4.phase, MID),
item(right.x, right.y, gearD(40, mo, 5), '', spin(40, 1, 60), 0, MID),
item(left.x, left.y, gearD(36, mo, 5), '', spin(36, -1, 60), 0, MID),
item(esc.x, esc.y, gearD(15, mo, 3), 'acc', spin(15, 1, 24), 0, HIGH),
item(T.x, T.y, wheelD(45, 3, 3), '', spin(48, 1, 60), 0, HIGH),
item(T.x, T.y, wheelD(24, 2.5, 3), 'acc', swing(0.8), 0, HIGH, spiral(3, 12, 6))
];

// Parafusos e rubis
const screw = (x, y, ang) => ({ style: 'position:absolute;left:' + (x - 4.5).toFixed(1) + 'px;top:' + (y - 4.5).toFixed(1) + 'px;width:9px;height:9px;border-radius:50%;background:linear-gradient(' + ang + 'deg,rgba(0,0,0,0) 40%,#0a0a0b 40%,#0a0a0b 60%,rgba(0,0,0,0) 60%),radial-gradient(circle at 35% 30%,#a4a4aa 0%,#48484e 50%,#16161a 100%);box-shadow:0 2px 3px rgba(0,0,0,0.9),0 0 0 1px rgba(0,0,0,0.6)' });
const screws = [45, 90, 135, 225, 270, 315].map((a, i) => { const p = P(a, 202); return screw(p.x, p.y, (i * 47) % 180); });
[45, 315, 90, 270].forEach((a, i) => { const p = P(a, 110); screws.push(screw(p.x, p.y, 20 + i * 40)); });
const jewel = (x, y) => ({ style: 'position:absolute;left:' + (x - 4.5).toFixed(1) + 'px;top:' + (y - 4.5).toFixed(1) + 'px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff 0,#ffffff 10%,' + accent + ' 45%,#2a0a04 100%);box-shadow:0 0 0 2.2px #55555b,0 0 0 3px #0a0a0b,0 3px 4px rgba(0,0,0,0.9)' });
const jewels = [g3, g4, right, left, T].map((p) => jewel(p.x, p.y));

return {
accent, far, back, deep, wheels, framePath, tbPath, screws, jewels,
hh: String(d.getHours()).padStart(2, '0'), mm: String(m).padStart(2, '0'), ss: String(s).padStart(2, '0'),
hourDeg: h * 30 + m * 0.5,
minuteDeg: m * 6 + s * 0.1,
secondDeg: s * 6
};
}
}
</script>
</body>
</html>
