<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Treino</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bbb}a:hover{color:#fff}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
</style>
</helmet>
<div style="width: 520px; height: 520px; background: #161618; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; color: #e8e8ea">
<div style="width: 482px; height: 482px; border-radius: 50%; padding: 16px; box-sizing: border-box; background: linear-gradient(145deg, #4a4b50 0%, #1b1b1e 45%, #0a0a0b 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.18)">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 35%, #141416 0%, #09090a 70%, #050505 100%)">

<svg viewBox="0 0 450 450" width="450" height="450" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="{{stepTrack}}" style="fill: none; stroke: #1c1c1f; stroke-width: 10; stroke-linecap: round"></path>
<path d="{{stepArc}}" style="fill: none; stroke: {{accent}}; stroke-width: 10; stroke-linecap: round"></path>
<sc-for list="{{zones}}" as="z" hint-placeholder-count="5">
<path d="{{z.d}}" style="{{z.style}}"></path>
</sc-for>
<circle cx="{{hrDot.x}}" cy="{{hrDot.y}}" r="8" style="fill: #ffffff; stroke: #050505; stroke-width: 3"></circle>
</svg>

<div style="position: absolute; left: 36px; top: 300px; width: 40px; text-align: center; font-weight: 600; font-size: 10px; letter-spacing: 1px; color: #6a6a70; transform: rotate(-62deg)">PASSOS</div>
<div style="position: absolute; left: 374px; top: 300px; width: 40px; text-align: center; font-weight: 600; font-size: 10px; letter-spacing: 1px; color: #6a6a70; transform: rotate(62deg)">ZONA</div>

<div style="position: absolute; left: 0; top: 40px; width: 450px; display: flex; justify-content: center; align-items: center; gap: 10px; font-weight: 600; font-size: 13px; letter-spacing: 2px; color: #8a8a90">
<span>{{dateLabel}}</span>
<span style="width: 3px; height: 3px; border-radius: 50%; background: #4a4a50"></span>
<span style="display: flex; align-items: center; gap: 4px">
<svg width="18" height="10" viewBox="0 0 18 10" aria-hidden="true"><rect x="0.75" y="0.75" width="14.5" height="8.5" rx="2" style="fill: none; stroke: #8a8a90; stroke-width: 1.5"></rect><rect x="16" y="3" width="1.5" height="4" rx="0.5" style="fill: #8a8a90"></rect><rect x="2.5" y="2.5" width="{{battW}}" height="5" rx="1" style="fill: #8a8a90"></rect></svg>
<span>{{battery}}%</span>
</span>
</div>

<div style="position: absolute; left: 0; top: 60px; width: 450px; display: flex; justify-content: center; align-items: baseline; gap: 2px">
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 96px; line-height: 1; letter-spacing: 1px; color: #f4f4f6">{{hhmm}}</span>
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 30px; line-height: 1; color: #6a6a70; width: 30px">{{ss}}</span>
</div>

<div style="position: absolute; left: 75px; top: 168px; width: 300px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px; border-top: 1px solid #1e1e21; border-bottom: 1px solid #1e1e21; padding: 10px 0px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" style="fill: {{hrColor}}; stroke: {{hrColor}}; stroke-width: 1.5; stroke-linejoin: round"></path></svg>
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 38px; line-height: 1; color: #f4f4f6">{{bpm}}</span>
<span style="font-weight: 600; font-size: 11px; letter-spacing: 2px; color: {{hrColor}}">{{zoneLabel}}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; border-left: 1px solid #1e1e21; border-right: 1px solid #1e1e21">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.4 2.6-5.6 3.9-8.6.9 1.9 1.3 3 1.3 4.6 1.2-1.1 2.3-3.4 2.3-7.3 3.6 2.3 5.5 6.4 5.5 11.3 0 3.6-2.6 6.2-6.5 6.2z" style="fill: none; stroke: #ff8a3d; stroke-width: 1.8; stroke-linejoin: round"></path></svg>
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 38px; line-height: 1; color: #f4f4f6">{{kcal}}</span>
<span style="font-weight: 600; font-size: 11px; letter-spacing: 2px; color: #ff8a3d">KCAL</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3.5c1.7 0 2.6 1.9 2.6 4.4S9.7 12 8 12 5.4 10.4 5.4 7.9 6.3 3.5 8 3.5zM6 14h4v1.6a2 2 0 0 1-4 0zM16 8.5c1.7 0 2.6 1.9 2.6 4.4S17.7 17 16 17s-2.6-1.6-2.6-4.1.9-4.4 2.6-4.4zM14 19h4v.6a2 2 0 0 1-4 0z" style="fill: none; stroke: {{accent}}; stroke-width: 1.6; stroke-linejoin: round"></path></svg>
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 38px; line-height: 1; color: #f4f4f6">{{steps}}</span>
<span style="font-weight: 600; font-size: 11px; letter-spacing: 2px; color: {{accent}}">{{stepPct}}% META</span>
</div>
</div>

<div style="position: absolute; left: 0; top: 268px; width: 450px; display: flex; justify-content: center; align-items: baseline; gap: 6px">
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 48px; line-height: 1; letter-spacing: 1px; color: {{swColor}}">{{swMain}}</span>
<span style="font-family: 'Bebas Neue', sans-serif; font-size: 26px; line-height: 1; color: {{swColor}}; opacity: 0.7">{{swTenth}}</span>
</div>

<div style="position: absolute; left: 0; top: 330px; width: 450px; display: flex; justify-content: center; align-items: center; gap: 18px">
<button type="button" onClick="{{reset}}" aria-label="Zerar cronômetro" style="width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid #2e2e32; background: #121214; display: flex; align-items: center; justify-content: center; padding: 0px; opacity: {{resetOpacity}}">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" style="fill: none; stroke: #c8c8cc; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg>
</button>
<button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="{{toggleStyle}}">
<sc-if value="{{running}}" hint-placeholder-val="{{ false }}">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" style="fill: #ffffff"></rect><rect x="14" y="5" width="4" height="14" rx="1" style="fill: #ffffff"></rect></svg>
</sc-if>
<sc-if value="{{stopped}}" hint-placeholder-val="{{ true }}">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" style="fill: #0a0a0b"></path></svg>
</sc-if>
<span style="font-weight: 700; font-size: 13px; letter-spacing: 2px">{{toggleText}}</span>
</button>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#b6f03c","options":["#b6f03c","#3ea6ff","#ff8a3d","#e8e8ea"]},"stepGoal":{"editor":"int","default":10000,"min":1000,"max":30000,"step":500},"liveTime":{"editor":"boolean","default":true},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { running: false, base: 0, startedAt: 0, now: Date.now() };
}
componentDidMount() {
this.timer = setInterval(() => this.setState({ now: Date.now() }), 100);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const accent = this.props.accent ?? '#b6f03c';
const goal = this.props.stepGoal ?? 10000;
const live = this.props.liveTime ?? true;
const st = this.state;
const d = live ? new Date(st.now) : new Date(2026, 9, 17, 18, 42, 7);
const pad = (v) => String(v).padStart(2, '0');
const days = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];

// Cronômetro
const elapsed = st.base + (st.running ? st.now - st.startedAt : 0);
const es = elapsed / 1000;
const mm = Math.floor(es / 60), sec = Math.floor(es % 60), tenth = Math.floor((elapsed % 1000) / 100);
const toggle = () => this.setState(st.running
? { running: false, base: elapsed }
: { running: true, startedAt: Date.now() });
const reset = () => { if (!st.running) this.setState({ base: 0 }); };

// Dados simulados no protótipo (no relógio vêm do sensor e do Samsung Health)
const effort = 1 - Math.exp(-es / 40);
const bpm = Math.round((st.running ? 72 + 70 * effort : 72) + 3 * Math.sin(st.now / 1700));
const kcal = Math.round(412 + es * 0.15);
const steps = Math.round(7842 + es * 2.6);
const ZONES = [
{ max: 104, color: '#3ea6ff', label: 'Z1 LEVE' },
{ max: 123, color: '#2ecc71', label: 'Z2 QUEIMA' },
{ max: 142, color: '#f4d03f', label: 'Z3 AERÓBICO' },
{ max: 161, color: '#ff8a3d', label: 'Z4 LIMIAR' },
{ max: 999, color: '#ff3b30', label: 'Z5 MÁXIMO' }
];
const zi = ZONES.findIndex((z) => bpm <= z.max);
const zone = ZONES[zi];

// Arcos: passos à esquerda (sobe de baixo para cima) e zonas de frequência à direita
const P = (a, r) => ({ x: 225 + r * Math.sin(a * Math.PI / 180), y: 225 - r * Math.cos(a * Math.PI / 180) });
const f = (v) => v.toFixed(2);
const arc = (a0, a1, r) => { const p = P(a0, r), q = P(a1, r), big = Math.abs(a1 - a0) > 180 ? 1 : 0, sw = a1 > a0 ? 1 : 0; return 'M' + f(p.x) + ' ' + f(p.y) + ' A' + r + ' ' + r + ' 0 ' + big + ' ' + sw + ' ' + f(q.x) + ' ' + f(q.y); };
const R = 211;
const pct = Math.min(1, steps / goal);
const stepEnd = 200 + 140 * pct;
const zones = ZONES.map((z, i) => {
const a0 = 160 - i * 28 - 1.5, a1 = 160 - (i + 1) * 28 + 1.5;
return { d: arc(a0, a1, R), style: 'fill:none;stroke:' + z.color + ';stroke-width:10;opacity:' + (i === zi ? 1 : 0.28) };
});
const hrA = 160 - 140 * Math.max(0, Math.min(1, (bpm - 85) / (180 - 85)));
const dot = P(hrA, R);

const battery = 82;
return {
accent,
stepTrack: arc(200, 340, R),
stepArc: arc(200, Math.max(200.5, stepEnd), R),
zones, hrDot: { x: f(dot.x), y: f(dot.y) },
dateLabel: days[d.getDay()] + ' ' + pad(d.getDate()),
battery, battW: (11 * battery / 100).toFixed(1),
hhmm: pad(d.getHours()) + ':' + pad(d.getMinutes()),
ss: pad(d.getSeconds()),
bpm, hrColor: zone.color, zoneLabel: zone.label,
kcal, steps: steps.toLocaleString('pt-BR'), stepPct: Math.round(pct * 100),
swMain: pad(mm) + ':' + pad(sec), swTenth: ',' + tenth,
swColor: st.running ? '#f4f4f6' : (elapsed ? '#c8c8cc' : '#5a5a60'),
running: st.running, stopped: !st.running,
toggle, reset,
resetOpacity: !st.running && elapsed ? 1 : 0.35,
toggleLabel: st.running ? 'Parar cronômetro' : 'Iniciar cronômetro',
toggleText: st.running ? 'PARAR' : (elapsed ? 'CONTINUAR' : 'INICIAR'),
toggleStyle: 'height:56px;min-width:150px;padding:0 22px;border-radius:28px;border:none;display:flex;align-items:center;justify-content:center;gap:8px;' + (st.running ? 'background:#ff3b30;color:#ffffff' : 'background:' + accent + ';color:#0a0a0b')
};
}
}
</script>
</body>
</html>
