<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sempre ligado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bbb}a:hover{color:#fff}
</style>
<style>html,body{margin:0;background:#161618;overflow:hidden}</style>
</head>
<body>
<template id="dc-tpl">

<div style="width: 520px; height: 520px; background: #161618; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif">
<div style="width: 482px; height: 482px; border-radius: 50%; padding: 16px; box-sizing: border-box; background: linear-gradient(145deg, #4a4b50 0%, #1b1b1e 45%, #0a0a0b 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.18)">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; overflow: hidden; background: #000000">

<div style="position: absolute; left: 165px; top: 15px; width: 120px; height: 100px; display: flex; align-items: center; justify-content: center">
<span style="font-size: 92px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px #75757b">12</span>
</div>
<div style="position: absolute; left: 325px; top: 175px; width: 120px; height: 100px; display: flex; align-items: center; justify-content: center">
<span style="font-size: 92px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px #75757b">3</span>
</div>
<div style="position: absolute; left: 165px; top: 335px; width: 120px; height: 100px; display: flex; align-items: center; justify-content: center">
<span style="font-size: 92px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px #75757b">6</span>
</div>
<div style="position: absolute; left: 5px; top: 175px; width: 120px; height: 100px; display: flex; align-items: center; justify-content: center">
<span style="font-size: 92px; line-height: 1; color: transparent; -webkit-text-stroke: 1.5px #75757b">9</span>
</div>

<div style="position: absolute; left: 175px; top: 150px; width: 100px; display: flex; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 500; font-size: 18px; letter-spacing: 3px; color: #6a6a70">{{dateLabel}}</div>

<div style="position: absolute; left: 218px; top: 105px; width: 14px; height: 120px; box-sizing: border-box; border: 1.5px solid #a8a8ae; border-radius: 7px 7px 2px 2px; transform-origin: 50% 100%; transform: rotate({{hourDeg}}deg)"></div>
<div style="position: absolute; left: 220px; top: 40px; width: 10px; height: 185px; box-sizing: border-box; border: 1.5px solid #a8a8ae; border-radius: 5px 5px 2px 2px; transform-origin: 50% 100%; transform: rotate({{minuteDeg}}deg)"></div>
<div style="position: absolute; left: 217px; top: 217px; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; background: #000000; border: 2px solid {{accent}}"></div>

</div>
</div>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"accent":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#3ea6ff","#c6ff3d","#e8e8ea"]},"liveTime":{"editor":"boolean","default":true},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => this.setState({ now: Date.now() }), 30000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const live = this.props.liveTime ?? true;
const d = live ? new Date() : new Date(2026, 9, 4, 10, 9, 30);
const h = d.getHours() % 12, m = d.getMinutes();
const days = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
return {
accent: this.props.accent ?? '#ff5a1f',
hourDeg: h * 30 + m * 0.5,
minuteDeg: m * 6,
dateLabel: days[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0')
};
}
}
</script>
<script src="../dc-mini.js"></script>
</body>
</html>
