<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Túnel cromado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bbb}a:hover{color:#fff}
@keyframes rspin{to{transform:rotate(360deg)}}
@keyframes rspinr{to{transform:rotate(-360deg)}}
@keyframes tzoom{0%{transform:scale(0.12);opacity:0}18%{opacity:1}80%{opacity:0.85}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion: reduce){.ra{animation:none !important}}
</style>
<style>html,body{margin:0;background:#161618;overflow:hidden}</style>
</head>
<body>
<template id="dc-tpl">

<div style="width: 520px; height: 520px; background: #161618; display: flex; align-items: center; justify-content: center; font-family: 'Barlow', sans-serif">
<div style="width: 482px; height: 482px; border-radius: 50%; padding: 16px; box-sizing: border-box; background: linear-gradient(145deg, #4a4b50 0%, #1b1b1e 45%, #0a0a0b 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.18)">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; overflow: hidden; background: #000000; isolation: isolate">

<sc-for list="{{rings}}" as="r" hint-placeholder-count="9">
<div class="ra" style="{{r.zoom}}"><div style="{{r.blur}}"><div class="ra" style="{{r.ring}}"></div></div></div>
</sc-for>

<div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.6) 0, rgba(0,0,0,0.3) 110px, rgba(0,0,0,0) 160px)"></div>
<div style="position: absolute; inset: 0; background: radial-gradient(ellipse 190px 120px at 50% 50%, rgba(110,110,116,0.38) 0, rgba(50,50,54,0.22) 55%, rgba(0,0,0,0) 100%)"></div>

<div style="position: absolute; left: 0; top: 0; width: 450px; height: 450px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="font-family: 'Bebas Neue', sans-serif; font-size: 150px; line-height: 0.9; letter-spacing: 1px; background: linear-gradient(180deg, #cdb27a 0%, #b0935a 38%, #8e7243 70%, #6a5330 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 -1px 0 rgba(255,232,186,0.28)) drop-shadow(0 3px 2px rgba(0,0,0,0.95)) drop-shadow(0 10px 8px rgba(0,0,0,0.95)) drop-shadow(0 20px 14px rgba(0,0,0,0.75))">{{time}}</div>
<div style="font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 5px; color: #9a8256; text-shadow: 0 2px 4px rgba(0,0,0,0.9)">{{dateLabel}}</div>
</div>

</div>
</div>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"animate":{"editor":"boolean","default":true},"liveTime":{"editor":"boolean","default":true},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const animate = this.props.animate ?? true;
const live = this.props.liveTime ?? true;
const d = live ? new Date() : new Date(2026, 9, 4, 13, 49, 0);
const pad = (v) => String(v).padStart(2, '0');
const days = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
const paused = animate ? '' : ';animation-play-state:paused';
// Anéis cromados que nascem no centro e vêm na direção de quem olha (efeito túnel)
const N = 9, cycle = 9;
const rings = [];
for (let i = 0; i < N; i++) {
const R = 205, w = 8 + (i % 3) * 4, a0 = i * 47, dir = i % 2 ? -1 : 1;
const mask = 'radial-gradient(circle at 50% 50%, transparent 0, transparent ' + (R - w - 3) + 'px, #000 ' + (R - w) + 'px, #000 ' + (R - 3) + 'px, transparent ' + R + 'px)';
rings.push({
zoom: 'position:absolute;inset:0;mix-blend-mode:screen;animation:tzoom ' + cycle + 's linear infinite;animation-delay:-' + (i * cycle / N).toFixed(2) + 's' + paused,
blur: 'position:absolute;inset:0;filter:blur(0.8px) drop-shadow(0 0 10px rgba(255,255,255,0.12))',
ring: 'position:absolute;left:' + (225 - R) + 'px;top:' + (225 - R) + 'px;width:' + 2 * R + 'px;height:' + 2 * R + 'px;border-radius:50%;background:conic-gradient(from ' + a0 + 'deg, #7a7a80 0deg, #1a1a1d 40deg, #55555b 90deg, #08080a 150deg, #6a6a70 200deg, #121214 250deg, #48484e 300deg, #7a7a80 360deg);-webkit-mask:' + mask + ';mask:' + mask + ';animation:' + (dir > 0 ? 'rspin' : 'rspinr') + ' ' + (10 + i) + 's linear infinite' + paused
});
}
return {
rings,
time: pad(d.getHours()) + ':' + pad(d.getMinutes()),
dateLabel: days[d.getDay()] + ' ' + pad(d.getDate())
};
}
}
</script>
<script src="../dc-mini.js"></script>
</body>
</html>
