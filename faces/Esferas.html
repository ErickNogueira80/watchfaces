<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Esferas magnéticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Bebas+Neue&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#bbb}a:hover{color:#fff}
</style>
<style>html,body{margin:0;background:#161618;overflow:hidden}</style>
</head>
<body>
<template id="dc-tpl">

<div style="width: 520px; height: 520px; background: #161618; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; color: #e8e8ea">
<div style="width: 482px; height: 482px; border-radius: 50%; padding: 16px; box-sizing: border-box; background: linear-gradient(145deg, #4a4b50 0%, #1b1b1e 45%, #0a0a0b 100%); box-shadow: 0 30px 60px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.18)">
<div style="position: relative; width: 450px; height: 450px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 40% 30%, #27272a 0%, #161618 55%, #0b0b0c 100%)">

<svg viewBox="0 0 450 450" width="450" height="450" style="position: absolute; left: 0; top: 0">
<defs>
<radialGradient id="esTrack" cx="0.5" cy="0.5" r="0.5"><stop offset="0.85" style="stop-color: #050505"></stop><stop offset="1" style="stop-color: #101012"></stop></radialGradient>
<linearGradient id="esBlock" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: #4a4a50"></stop><stop offset="0.5" style="stop-color: #38383d"></stop><stop offset="1" style="stop-color: #26262a"></stop></linearGradient>
<linearGradient id="esDisc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: #3c3c41"></stop><stop offset="0.55" style="stop-color: #2a2a2e"></stop><stop offset="1" style="stop-color: #1a1a1d"></stop></linearGradient>
</defs>
<path d="{{outerTrack}}" style="fill: #070708; fill-rule: evenodd; stroke: rgba(255,255,255,0.06); stroke-width: 1"></path>
<path d="{{innerTrack}}" style="fill: #070708; fill-rule: evenodd; stroke: rgba(255,255,255,0.05); stroke-width: 1"></path>
</svg>

<svg viewBox="0 0 450 450" width="450" height="450" style="position: absolute; left: 0; top: 0; filter: drop-shadow(0 -1px 0 rgba(255,255,255,0.14)) drop-shadow(0 6px 6px rgba(0,0,0,0.85))">
<path d="{{blocks}}" style="fill: url(#esBlock); fill-rule: nonzero"></path>
</svg>

<sc-for list="{{numerals}}" as="n" hint-placeholder-count="12">
<div style="{{n.style}}"><span style="font-weight: 700; font-size: {{n.size}}px; line-height: 1; letter-spacing: -0.5px; color: #1b1b1e; text-shadow: 0 1px 0 rgba(255,255,255,0.16), 0 -1px 0 rgba(0,0,0,0.6)">{{n.t}}</span></div>
</sc-for>

<div style="position: absolute; inset: 0; transform: rotate({{hourDeg}}deg)">
<div style="position: absolute; left: 216px; top: 10px; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #ffffff 0%, #d8d8dc 18%, #8a8a90 50%, #2a2a2d 85%, #111113 100%); box-shadow: 0 4px 5px rgba(0,0,0,0.9), 0 0 0 1px rgba(0,0,0,0.5)"></div>
</div>

<svg viewBox="0 0 450 450" width="450" height="450" style="position: absolute; left: 0; top: 0; filter: drop-shadow(0 -1px 0 rgba(255,255,255,0.14)) drop-shadow(0 10px 10px rgba(0,0,0,0.9))">
<circle cx="225" cy="225" r="94" style="fill: url(#esDisc)"></circle>
</svg>

<div style="position: absolute; inset: 0; transform: rotate({{minuteDeg}}deg); transition: {{minuteTransition}}">
<div style="position: absolute; left: 216.5px; top: 107.5px; width: 17px; height: 17px; border-radius: 50%; background: radial-gradient(circle at 36% 30%, #ffffff 0%, #d8d8dc 18%, #8a8a90 50%, #2a2a2d 85%, #111113 100%); box-shadow: 0 4px 5px rgba(0,0,0,0.9), 0 0 0 1px rgba(0,0,0,0.5)"></div>
</div>

<div style="position: absolute; left: 131px; top: 131px; width: 188px; height: 188px; border-radius: 50%; display: flex; align-items: center; justify-content: center">
<span style="{{timeStyle}}">{{time}}</span>
</div>

<div style="position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 40%); pointer-events: none"></div>

</div>
</div>
</div>
</template>
<script type="text/x-dc" id="dc-logic" data-props='{"timeFont":{"editor":"enum","options":["Cinzel","Bebas Neue"],"default":"Cinzel"},"timeTone":{"editor":"enum","options":["gravado","claro"],"default":"gravado"},"liveTime":{"editor":"boolean","default":true},"$preview":{"width":520,"height":520}}'>
class Component extends DCLogic {
componentDidMount() {
this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
}
componentWillUnmount() {
clearInterval(this.timer);
}
renderVals() {
const live = this.props.liveTime ?? true;
const d = live ? new Date() : new Date(2026, 9, 17, 10, 9, 30);
const h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
const pad = (v) => String(v).padStart(2, '0');

const P = (a, r) => ({ x: 225 + r * Math.sin(a * Math.PI / 180), y: 225 - r * Math.cos(a * Math.PI / 180) });
const f = (v) => v.toFixed(2);
const circ = (r) => 'M225 ' + (225 - r) + ' A' + r + ' ' + r + ' 0 1 1 225 ' + (225 + r) + ' A' + r + ' ' + r + ' 0 1 1 225 ' + (225 - r) + ' Z ';
const sector = (a0, a1, r1, r2) => {
const o0 = P(a0, r2), o1 = P(a1, r2), i1 = P(a1, r1), i0 = P(a0, r1);
return 'M' + f(o0.x) + ' ' + f(o0.y) + ' A' + r2 + ' ' + r2 + ' 0 0 1 ' + f(o1.x) + ' ' + f(o1.y) + ' L' + f(i1.x) + ' ' + f(i1.y) + ' A' + r1 + ' ' + r1 + ' 0 0 0 ' + f(i0.x) + ' ' + f(i0.y) + ' Z ';
};

// Anel de 12 blocos com fresta entre eles; algarismos com o topo voltado para fora
const ROM = ['XII', 'I', 'II', 'III', 'IIII', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
let blocks = '';
const numerals = [];
for (let i = 0; i < 12; i++) {
blocks += sector(i * 30 - 14.2, i * 30 + 14.2, 124, 194);
const p = P(i * 30, 160), t = ROM[i];
numerals.push({
t, size: t.length >= 4 ? 27 : (t.length === 3 ? 31 : 34),
style: 'position:absolute;left:' + f(p.x - 40) + 'px;top:' + f(p.y - 22) + 'px;width:80px;height:44px;display:flex;align-items:center;justify-content:center;transform:rotate(' + (i * 30) + 'deg)'
});
}

const font = this.props.timeFont ?? 'Cinzel';
const light = (this.props.timeTone ?? 'gravado') === 'claro';
const base = font === 'Cinzel' ? "font-family:'Cinzel',serif;font-weight:700;font-size:50px;letter-spacing:1px" : "font-family:'Bebas Neue',sans-serif;font-size:70px;letter-spacing:2px";
const tone = light
? 'color:#dcdce0;text-shadow:0 2px 3px rgba(0,0,0,0.85)'
: 'color:#18181b;text-shadow:0 1px 0 rgba(255,255,255,0.18),0 -1px 0 rgba(0,0,0,0.7)';

return {
outerTrack: circ(215) + circ(199),
innerTrack: circ(120) + circ(98),
blocks, numerals,
hourDeg: f((h % 12 + m / 60) * 30),
minuteDeg: (h * 60 + m + s / 60) * 6,
minuteTransition: 'transform 1s linear',
time: pad(h) + ':' + pad(m),
timeStyle: base + ';line-height:1;' + tone
};
}
}
</script>
<script src="../dc-mini.js"></script>
</body>
</html>
